# Publish statscapybara.com from `main`.
#
# This replaces GitHub Pages' branch-deploy, which served the repository
# verbatim (`.nojekyll` makes that literal) and so published CLAUDE.md,
# AGENTS.md, PROMPTS.md, ROADMAP.md, VOICE.md, README.md and tools/ on
# the live domain. The build step below assembles "the committed tree
# minus a list" and uploads that instead; the list lives in
# tools/make-pages-artifact.js, which is also what the local proof runs.
#
# It is NOT a build step for the site. Nothing is processed, minified or
# rewritten — every published file is copied byte-for-byte, and the
# no-build law in CLAUDE.md still holds.
#
# Source must be set to "GitHub Actions" under Settings → Pages for this
# to take effect. Rolling back is flipping that setting back to the
# branch; nothing in the repository has to change.
#
# Until 7 Oct 2026 it was still set to the branch (P122): every push
# also started GitHub's legacy "pages build and deployment" run, which
# uploads the whole repository, and the domain served whichever deploy
# finished last. bc38891 was the first push without a legacy run. The
# verify job below checks the live domain after every deploy and fails
# when a planning doc is served, among other checks; its summary says
# which check failed. tools/check-live.sh has the details.

# ---------------------------------------------------------------------
# Recovering a failed deploy — read this before pressing "Re-run".
#
# On 7 Sep 2026 (run #24, P83) the deploy job failed with "No artifacts
# named github-pages were found for this workflow run", eleven seconds
# after the build job had uploaded that artifact successfully. The
# artifact existed; deploy-pages' one-shot metadata lookup did not see
# it yet. That is a transient Actions/Pages API fault, it has no fix in
# this file (the lookup runs once and has no retry input — its timeout
# and error_count inputs govern deployment polling, not this call), and
# the recovery is simply to run the workflow again.
#
# But use "Re-run all jobs", NEVER "Re-run failed jobs". Artifacts from
# upload-artifact v4, which upload-pages-artifact v3 wraps, are scoped
# to one workflow RUN ATTEMPT. Re-running only the failed job re-runs
# deploy without re-running build, so the new attempt has no artifact at
# all and fails with the identical message — which is exactly what that
# run's second attempt did, 96 minutes later, in nine seconds. Re-running
# all jobs rebuilds the artifact and succeeds.
#
# Simplest of all: a later push to main supersedes a failed deploy
# outright. The artifact is the whole committed tree at the new head, so
# the next successful deploy carries the stranded commit's content with
# it. That is what happened here — P84's deploy published P83's work,
# and nothing had to be reverted or re-pushed.
# ---------------------------------------------------------------------

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-applied
# deploy is worse than a slightly stale one. The group is held until
# verify ends too (one to four minutes), so the next push cannot change
# sw.js while this run is still checking it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Assemble the artifact (the committed tree minus the development files)
        run: node tools/make-pages-artifact.js _site

      - name: Upload the artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Check the live domain from the runner, which can reach it (cloud
  # sessions cannot). Waits 60 s so a legacy deploy that finishes a
  # moment later is caught, then retries for up to 3 minutes. Fails
  # unless / is 200, the planning docs and tools/audit.js are 404, and
  # the served sw.js has this commit's CACHE_VERSION. A pass does not
  # prove the Pages setting is fixed; see tools/check-live.sh.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository (for the script and sw.js)
        uses: actions/checkout@v4

      - name: Check that statscapybara.com serves this commit's filtered artifact
        run: bash tools/check-live.sh --wait 60 --for 180 https://statscapybara.com
