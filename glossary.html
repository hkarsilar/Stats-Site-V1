  <!-- ============ glossary ============ -->
  <script>
  (function () {
    "use strict";
    // Terms live in assets/js/glossary-data.js (window.GLOSSARY) — the single
    // source of truth shared with flashcards.html. Add terms there, not here.
    var TERMS = window.GLOSSARY || [];

    var host = document.getElementById("gloss-host");
    var countEl = document.getElementById("gloss-count");
    var filter = document.getElementById("gloss-filter");
    var alphaEl = document.getElementById("gloss-alpha");
    var toggleAll = document.getElementById("gloss-toggle-all");
    var allOpen = false;          // "Expand all" state, kept across re-renders

    function slugify(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
    // "1.5 × IQR rule" and anything else not starting with a letter buckets under "#"
    function bucket(t) { var c = t[0].toUpperCase(); return /[A-Z]/.test(c) ? c : "#"; }
    function bucketId(k) { return "gloss-L-" + (k === "#" ? "num" : k); }

    var KEYS = ["#"].concat("ABCDEFGHIJKLMNOPQRSTUVWXYZ".split(""));

    /* The A–Z bar is built once and never reflows: letters with no match go
       inert rather than disappearing, so the row stays a stable target. */
    function buildAlpha() {
      alphaEl.innerHTML = KEYS.map(function (k) {
        return '<a href="#' + bucketId(k) + '" data-k="' + k + '">' + k + '</a>';
      }).join("");
    }
    function markAlpha(present) {
      Array.prototype.forEach.call(alphaEl.children, function (a) {
        a.classList.toggle("gloss-alpha-off", !present[a.dataset.k]);
      });
    }

    function render(q) {
      q = (q || "").trim().toLowerCase();
      var matches = TERMS.filter(function (x) {
        return !q || x.t.toLowerCase().indexOf(q) >= 0 || x.d.toLowerCase().indexOf(q) >= 0;
      }).sort(function (a, b) { return a.t.localeCompare(b.t); });

      countEl.textContent = matches.length + " of " + TERMS.length + " terms";
      // a live filter already means "show me this" — don't make them click twice
      var openNow = allOpen || !!q;

      var present = {};
      matches.forEach(function (x) { present[bucket(x.t)] = true; });
      markAlpha(present);

      if (!matches.length) { host.innerHTML = '<p class="gloss-empty">No terms match “' + q + '”. Try a shorter word.</p>'; return; }

      var html = "", letter = "";
      matches.forEach(function (x) {
        var k = bucket(x.t);
        if (k !== letter) { letter = k; html += '<div class="gloss-letter" id="' + bucketId(k) + '">' + k + '</div>'; }
        var link = x.s ? ' <a class="gloss-link" href="' + x.s + '/">' + (x.l || "See lesson") + ' →</a>' : "";
        html += '<details class="gloss-item" id="' + slugify(x.t) + '"' + (openNow ? " open" : "") +
                '><summary>' + x.t + '</summary><p class="gloss-def">' + x.d + link + '</p></details>';
      });
      host.innerHTML = '<div class="gloss-list">' + html + '</div>';
    }

    function setAll(open) {
      Array.prototype.forEach.call(host.querySelectorAll("details.gloss-item"), function (d) { d.open = open; });
    }
    function syncToggleLabel() {
      toggleAll.textContent = allOpen ? "Collapse all" : "Expand all";
      toggleAll.setAttribute("aria-expanded", String(allOpen));
    }

    filter.addEventListener("input", function () { render(filter.value); });
    toggleAll.addEventListener("click", function () {
      allOpen = !allOpen; setAll(allOpen); syncToggleLabel();
    });
    document.getElementById("print-btn").addEventListener("click", function () { window.print(); });

    /* Print the whole glossary, not a list of headwords: open every term for
       the sheet and put the reader's own expand/collapse state back after. */
    var printOpened = [];
    window.addEventListener("beforeprint", function () {
      printOpened = Array.prototype.filter.call(
        host.querySelectorAll("details.gloss-item"), function (d) { return !d.open; });
      printOpened.forEach(function (d) { d.open = true; });
    });
    window.addEventListener("afterprint", function () {
      printOpened.forEach(function (d) { d.open = false; });
      printOpened = [];
    });

    buildAlpha();
    syncToggleLabel();
    render("");

    // support deep links like glossary.html#p-value — open the term, don't just scroll past it
    if (location.hash) {
      var el = document.getElementById(location.hash.slice(1));
      if (el) { if (el.tagName === "DETAILS") el.open = true; el.scrollIntoView(); }
    }
  })();
  </script>
