  <script>
  (function () {
    "use strict";
    // term, def, and optional { s: "course/slug", l: "lesson label" } link.
    var TERMS = [
      { t: "Alpha (significance level)", d: "The Type I error rate you accept in advance — the probability of rejecting a true null hypothesis. Conventionally 0.05.", s: "stats-1/hypothesis-testing-logic", l: "Hypothesis Testing Logic" },
      { t: "Alternative hypothesis (H₁)", d: "The claim you're gathering evidence for — that an effect, difference, or relationship exists.", s: "stats-1/hypothesis-testing-logic", l: "Hypothesis Testing Logic" },
      { t: "ANOVA", d: "Analysis of Variance — a test for whether three or more group means differ, by comparing variance between groups to variance within groups.", s: "stats-2/one-way-anova", l: "One-Way ANOVA" },
      { t: "ANCOVA", d: "Analysis of Covariance — compares group means after statistically adjusting for one or more covariates, correcting baseline imbalance and soaking up noise.", s: "stats-3/ancova", l: "ANCOVA: Controlling for Covariates" },
      { t: "Adjusted means", d: "Group means evaluated at the same covariate value (usually the overall mean) — what ANCOVA actually compares.", s: "stats-3/ancova", l: "ANCOVA: Controlling for Covariates" },
      { t: "AIC / BIC", d: "Information criteria that score a model on fit while penalizing complexity, so you can compare non-nested models. Lower is better.", s: "stats-3/model-comparison", l: "Model Comparison" },
      { t: "Bayesian inference", d: "An approach that treats unknown parameters as having probability distributions, updating a prior belief with data to get a posterior.", s: "stats-4/bayesian-thinking", l: "Bayesian Thinking" },
      { t: "Between-groups variance", d: "How much the group means differ from the overall mean — the 'signal' in the numerator of the ANOVA F-ratio.", s: "stats-2/one-way-anova", l: "One-Way ANOVA" },
      { t: "Bonferroni correction", d: "A conservative fix for multiple comparisons: divide your alpha by the number of tests to keep the overall error rate in check.", s: "stats-2/post-hoc-tests", l: "Post-Hoc Tests" },
      { t: "Bootstrap", d: "Estimating uncertainty by resampling your data with replacement thousands of times, instead of relying on a formula.", s: "stats-4/bootstrap-and-resampling", l: "Bootstrap & Resampling" },
      { t: "Categorical variable", d: "A variable whose values are labels or categories (e.g. condition, group) rather than measured quantities.", s: "stats-1/types-of-data", l: "Types of Data" },
      { t: "Central Limit Theorem", d: "The result that the distribution of the sample mean approaches normal as n grows, whatever the population's shape.", s: "stats-1/central-limit-theorem", l: "Central Limit Theorem" },
      { t: "Chi-square test", d: "A test for association between categorical variables, comparing observed counts to the counts expected under independence.", s: "stats-2/chi-square-tests", l: "Chi-Square Tests" },
      { t: "Cohen's d", d: "A standardized effect size for the difference between two means, expressed in standard-deviation units.", s: "stats-1/effect-size-and-power", l: "Effect Size & Power" },
      { t: "Confidence interval", d: "A range that, over many repeated samples, would contain the true parameter a stated percentage of the time (e.g. 95%).", s: "stats-1/confidence-intervals", l: "Confidence Intervals" },
      { t: "Confounding variable", d: "A lurking third variable that influences both the predictor and the outcome, distorting their apparent relationship.", s: "stats-4/causal-dags-and-confounding", l: "Causal DAGs & Confounding" },
      { t: "Covariate", d: "A continuous variable (like a pretest or age) included in a model to statistically control for its influence on the outcome.", s: "stats-3/ancova", l: "ANCOVA: Controlling for Covariates" },
      { t: "Correlation (Pearson r)", d: "A number from −1 to +1 measuring the strength and direction of a straight-line relationship between two variables.", s: "stats-2/correlation", l: "Correlation" },
      { t: "Credible interval", d: "The Bayesian counterpart of a confidence interval: a range that contains the parameter with a stated posterior probability.", s: "stats-4/bayesian-estimation", l: "Bayesian Estimation" },
      { t: "Censoring", d: "An observation whose event hadn't happened yet when observation stopped — you know only that the true time exceeds what you saw.", s: "stats-4/survival-analysis", l: "Survival Analysis" },
      { t: "Collider", d: "A variable caused by both X and Y (X → C ← Y). Harmless if left alone — but adjusting for it creates a spurious X–Y association.", s: "stats-4/causal-dags-and-confounding", l: "Causal DAGs & Confounding" },
      { t: "Cross-validation", d: "Estimating out-of-sample accuracy by repeatedly fitting on part of the data and testing on the held-out rest (e.g. 5-fold).", s: "stats-4/cross-validation-and-overfitting", l: "Cross-Validation & Overfitting" },
      { t: "DAG (directed acyclic graph)", d: "A diagram of causal assumptions — arrows from causes to effects — that determines which variables you should (and shouldn't) adjust for.", s: "stats-4/causal-dags-and-confounding", l: "Causal DAGs & Confounding" },
      { t: "Degrees of freedom", d: "The number of values free to vary when estimating a statistic — it sets the exact shape of t, F, and χ² distributions.", s: "stats-1/one-sample-and-paired-t-tests", l: "One-Sample & Paired t-Tests" },
      { t: "Descriptive statistics", d: "Summaries of the data you actually have — means, spreads, charts — making no claim beyond the sample.", s: "stats-1/what-is-statistics", l: "What Is Statistics?" },
      { t: "Dummy coding", d: "Representing a categorical predictor as 0/1 indicator variables so it can enter a regression, relative to a reference category.", s: "stats-3/categorical-predictors-and-dummy-coding", l: "Categorical Predictors & Dummy Coding" },
      { t: "Effect size", d: "How big an effect is, independent of sample size — the practical significance that a p-value alone can't tell you.", s: "stats-1/effect-size-and-power", l: "Effect Size & Power" },
      { t: "Eigenvalue", d: "In factor analysis / PCA, the amount of total variance captured by a component; used to decide how many factors to keep.", s: "stats-3/factor-analysis-pca", l: "Factor Analysis / PCA" },
      { t: "Expected frequency", d: "The count you'd expect in a contingency-table cell if the two variables were independent — the baseline χ² compares against.", s: "stats-2/chi-square-tests", l: "Chi-Square Tests" },
      { t: "F-ratio", d: "The test statistic in ANOVA and regression: the ratio of explained (between) variance to unexplained (within) variance.", s: "stats-2/one-way-anova", l: "One-Way ANOVA" },
      { t: "Factorial ANOVA", d: "An ANOVA with two or more factors, letting you test each main effect and their interaction at once.", s: "stats-2/factorial-anova-two-way", l: "Factorial ANOVA (Two-Way)" },
      { t: "Fixed effect", d: "A model term whose specific levels are the ones you care about and want to estimate directly (contrast with random effect).", s: "stats-4/mixed-and-multilevel-models", l: "Mixed & Multilevel Models" },
      { t: "Generalized linear model (GLM)", d: "A regression framework that extends linear models to other outcomes (counts, binary) via a link function and non-normal errors.", s: "stats-4/generalized-linear-models", l: "Generalized Linear Models" },
      { t: "Heteroscedasticity", d: "Non-constant spread of residuals across the range of a predictor — a violation of a key regression assumption.", s: "stats-2/regression-diagnostics", l: "Regression Diagnostics" },
      { t: "Homogeneity of variance", d: "The assumption that compared groups have equal population variances; checked with tests like Levene's.", s: "stats-2/assumptions-and-when-they-break", l: "Assumptions & When They Break" },
      { t: "Independent-samples t-test", d: "A test comparing the means of two separate, unrelated groups.", s: "stats-1/independent-samples-t-test", l: "Independent Samples t-Test" },
      { t: "Indirect effect", d: "In mediation, the part of an X→Y effect that passes through a mediator M (the X→M→Y path).", s: "stats-3/mediation-and-indirect-effects", l: "Mediation & Indirect Effects" },
      { t: "Inferential statistics", d: "Using a sample to make uncertainty-aware statements about the larger population you didn't measure.", s: "stats-1/what-is-statistics", l: "What Is Statistics?" },
      { t: "Interaction effect", d: "When the effect of one variable on the outcome depends on the level of another variable.", s: "stats-3/interactions-in-regression", l: "Interactions in Regression" },
      { t: "Interquartile range (IQR)", d: "The spread of the middle 50% of the data (Q3 − Q1) — a measure of spread that ignores extreme outliers.", s: "stats-1/describing-data", l: "Describing Data" },
      { t: "Intraclass correlation (ICC)", d: "The share of total variance that lies between groups/clusters — how much observations within a group resemble each other.", s: "stats-4/mixed-and-multilevel-models", l: "Mixed & Multilevel Models" },
      { t: "Forest plot", d: "The standard meta-analysis picture: one row per study (square sized by weight, whiskers for its CI) and a diamond for the pooled effect.", s: "stats-4/meta-analysis", l: "Meta-Analysis & Forest Plots" },
      { t: "Hazard ratio", d: "How many times higher one group's instantaneous event rate is than another's — the effect size of survival analysis.", s: "stats-4/survival-analysis", l: "Survival Analysis" },
      { t: "Heterogeneity (I²)", d: "In meta-analysis, the share of between-study spread reflecting real differences in effects rather than sampling noise.", s: "stats-4/meta-analysis", l: "Meta-Analysis & Forest Plots" },
      { t: "Imputation", d: "Filling in missing values. Mean imputation shrinks variances and correlations; multiple imputation propagates the uncertainty honestly.", s: "stats-4/missing-data", l: "Missing Data & Imputation" },
      { t: "Kaplan–Meier estimator", d: "A step-curve estimate of survival probability over time, using censored observations for exactly as long as they were observed.", s: "stats-4/survival-analysis", l: "Survival Analysis" },
      { t: "Log-rank test", d: "A test comparing whole survival curves by accumulating observed-minus-expected events at every event time.", s: "stats-4/survival-analysis", l: "Survival Analysis" },
      { t: "Least squares", d: "The fitting principle behind linear regression: choose the line that minimizes the sum of squared residuals.", s: "stats-2/simple-linear-regression", l: "Simple Linear Regression" },
      { t: "Likelihood", d: "How probable the observed data are under a given parameter value — the engine of both maximum-likelihood and Bayesian estimation.", s: "stats-4/bayesian-thinking", l: "Bayesian Thinking" },
      { t: "Logistic regression", d: "A model for a binary outcome that predicts the log-odds of 'yes' with an S-shaped curve bounded between 0 and 1.", s: "stats-3/logistic-regression", l: "Logistic Regression" },
      { t: "Main effect", d: "The overall effect of one factor on the outcome, averaged across the levels of the other factors.", s: "stats-2/factorial-anova-two-way", l: "Factorial ANOVA (Two-Way)" },
      { t: "Mean", d: "The arithmetic average — every value summed and divided by the count. Sensitive to outliers.", s: "stats-1/describing-data", l: "Describing Data" },
      { t: "Median", d: "The middle value when the data are ordered — a measure of center robust to extreme values.", s: "stats-1/describing-data", l: "Describing Data" },
      { t: "Mediation", d: "A causal chain in which a predictor affects an outcome partly or wholly through an intervening variable.", s: "stats-3/mediation-and-indirect-effects", l: "Mediation & Indirect Effects" },
      { t: "MCAR / MAR / MNAR", d: "The three missingness mechanisms: pure chance, driven by other observed variables, or driven by the missing values themselves.", s: "stats-4/missing-data", l: "Missing Data & Imputation" },
      { t: "Meta-analysis", d: "Pooling effect sizes across studies, each weighted by its precision, into one combined estimate with honest uncertainty.", s: "stats-4/meta-analysis", l: "Meta-Analysis & Forest Plots" },
      { t: "Publication bias", d: "Significant results get published more often, so the visible literature overstates effects; funnel plots help diagnose it.", s: "stats-4/meta-analysis", l: "Meta-Analysis & Forest Plots" },
      { t: "Training vs. test data", d: "Data used to fit a model versus data reserved to evaluate it — only test performance can reveal overfitting.", s: "stats-4/cross-validation-and-overfitting", l: "Cross-Validation & Overfitting" },
      { t: "Moderation", d: "When a third variable changes the strength or direction of the relationship between two others (an interaction).", s: "stats-3/interactions-in-regression", l: "Interactions in Regression" },
      { t: "Multicollinearity", d: "High correlation among predictors in a regression, which inflates standard errors and makes coefficients unstable.", s: "stats-3/multicollinearity-and-variable-selection", l: "Multicollinearity & Variable Selection" },
      { t: "MANOVA", d: "Multivariate ANOVA — tests whether groups differ on a set of outcome variables at once, using their correlation structure instead of ignoring it.", s: "stats-3/manova", l: "MANOVA & Multivariate Tests" },
      { t: "MANCOVA", d: "MANOVA with covariates: compares groups on several outcomes simultaneously while adjusting for baseline variables.", s: "stats-3/manova", l: "MANOVA & Multivariate Tests" },
      { t: "Mahalanobis distance", d: "Distance measured relative to the data's covariance structure — 'how many standard deviations away, accounting for correlations.' The metric behind multivariate tests.", s: "stats-3/manova", l: "MANOVA & Multivariate Tests" },
      { t: "Multilevel / mixed model", d: "A model for nested data (students in schools, trials in people) with both fixed effects and random effects.", s: "stats-4/mixed-and-multilevel-models", l: "Mixed & Multilevel Models" },
      { t: "Multiple regression", d: "Predicting an outcome from several predictors at once, so each coefficient is the effect holding the others constant.", s: "stats-3/multiple-regression", l: "Multiple Regression" },
      { t: "Non-parametric test", d: "A test that avoids assuming a specific distribution, often by working with ranks (e.g. Mann-Whitney, Kruskal-Wallis).", s: "stats-2/non-parametric-alternatives", l: "Non-Parametric Alternatives" },
      { t: "Normal distribution", d: "The symmetric bell-shaped distribution defined by its mean and standard deviation; central to much of inference.", s: "stats-1/z-scores-and-the-normal-distribution", l: "Z-Scores & The Normal Distribution" },
      { t: "Null hypothesis (H₀)", d: "The default 'nothing is going on' claim — no effect, no difference — that a test tries to rule out.", s: "stats-1/hypothesis-testing-logic", l: "Hypothesis Testing Logic" },
      { t: "Odds ratio", d: "In logistic regression, the multiplicative change in the odds of the outcome for a one-unit rise in a predictor.", s: "stats-3/logistic-regression", l: "Logistic Regression" },
      { t: "Outlier", d: "An observation far from the rest of the data, which can strongly distort means, variances, and regression lines.", s: "stats-1/describing-data", l: "Describing Data" },
      { t: "Overfitting", d: "A model that captures noise as if it were signal — great on its own data, poor on new data.", s: "stats-4/cross-validation-and-overfitting", l: "Cross-Validation & Overfitting" },
      { t: "p-value", d: "The probability of data at least this extreme if the null hypothesis were true — not the probability the null is true.", s: "stats-1/hypothesis-testing-logic", l: "Hypothesis Testing Logic" },
      { t: "Parameter", d: "A true, usually unknown number describing a population (like the mean μ) that we estimate from a sample.", s: "stats-1/what-is-statistics", l: "What Is Statistics?" },
      { t: "Population", d: "The entire set of people or things you want to draw conclusions about.", s: "stats-1/what-is-statistics", l: "What Is Statistics?" },
      { t: "Post-hoc test", d: "A follow-up comparison run after a significant ANOVA to find which specific groups differ, with corrected error rates.", s: "stats-2/post-hoc-tests", l: "Post-Hoc Tests" },
      { t: "Posterior distribution", d: "In Bayesian inference, your updated belief about a parameter after combining the prior with the data.", s: "stats-4/bayesian-estimation", l: "Bayesian Estimation" },
      { t: "Pillai's trace", d: "A multivariate test statistic for MANOVA — the most robust of the four to assumption violations, and a sensible default to report.", s: "stats-3/manova", l: "MANOVA & Multivariate Tests" },
      { t: "Power (statistical)", d: "The probability a test detects a real effect of a given size — 1 minus the Type II error rate.", s: "stats-1/effect-size-and-power", l: "Effect Size & Power" },
      { t: "Principal component analysis (PCA)", d: "A technique that re-expresses correlated variables as a smaller set of uncorrelated components capturing most variance.", s: "stats-3/factor-analysis-pca", l: "Factor Analysis / PCA" },
      { t: "Prior distribution", d: "In Bayesian inference, the belief about a parameter you hold before seeing the current data.", s: "stats-4/bayesian-thinking", l: "Bayesian Thinking" },
      { t: "R² (coefficient of determination)", d: "The proportion of variance in the outcome explained by the model — from 0 (nothing) to 1 (perfect).", s: "stats-2/simple-linear-regression", l: "Simple Linear Regression" },
      { t: "Random effect", d: "A model term whose levels are a random sample from a larger population (e.g. specific participants or schools).", s: "stats-4/mixed-and-multilevel-models", l: "Mixed & Multilevel Models" },
      { t: "Regression coefficient", d: "The predicted change in the outcome for a one-unit increase in a predictor, holding the others constant.", s: "stats-3/multiple-regression", l: "Multiple Regression" },
      { t: "Repeated-measures ANOVA", d: "An ANOVA for designs where the same subjects are measured under several conditions, accounting for within-subject correlation.", s: "stats-2/repeated-measures-anova", l: "Repeated Measures ANOVA" },
      { t: "Residual", d: "The gap between an observed value and the value a model predicts — what the model failed to explain.", s: "stats-2/regression-diagnostics", l: "Regression Diagnostics" },
      { t: "Sample", d: "The subset of the population you actually measure and compute statistics from.", s: "stats-1/what-is-statistics", l: "What Is Statistics?" },
      { t: "Sampling distribution", d: "The distribution of a statistic (like the mean) across all possible samples — the bridge from sample to inference.", s: "stats-1/sampling-distributions", l: "Sampling Distributions" },
      { t: "Skewness", d: "Asymmetry in a distribution: a long right tail is positive skew, a long left tail is negative skew.", s: "stats-1/describing-data", l: "Describing Data" },
      { t: "Standard deviation", d: "The typical distance of values from their mean — the square root of the variance.", s: "stats-1/describing-data", l: "Describing Data" },
      { t: "Standard error", d: "The standard deviation of a statistic's sampling distribution — how much an estimate bounces from sample to sample.", s: "stats-1/sampling-distributions", l: "Sampling Distributions" },
      { t: "Statistic", d: "A number computed from a sample (like x̄) used to estimate a population parameter.", s: "stats-1/what-is-statistics", l: "What Is Statistics?" },
      { t: "t-test", d: "A test comparing means using the t-distribution, which accounts for extra uncertainty when the SD is estimated from a small sample.", s: "stats-1/one-sample-and-paired-t-tests", l: "One-Sample & Paired t-Tests" },
      { t: "Type I error", d: "A false positive — rejecting a null hypothesis that is actually true. Its rate is alpha.", s: "stats-1/hypothesis-testing-logic", l: "Hypothesis Testing Logic" },
      { t: "Type II error", d: "A false negative — failing to reject a null hypothesis that is actually false. Its rate is beta.", s: "stats-1/effect-size-and-power", l: "Effect Size & Power" },
      { t: "Variance", d: "The average squared distance of values from their mean — a foundational measure of spread.", s: "stats-1/describing-data", l: "Describing Data" },
      { t: "Variance inflation factor (VIF)", d: "A diagnostic for multicollinearity: how much a predictor's variance is inflated by its correlation with other predictors.", s: "stats-3/multicollinearity-and-variable-selection", l: "Multicollinearity & Variable Selection" },
      { t: "Wilks' lambda (Λ)", d: "A MANOVA test statistic: the proportion of outcome variance NOT explained by group membership — smaller means a stronger multivariate effect.", s: "stats-3/manova", l: "MANOVA & Multivariate Tests" },
      { t: "Z-score", d: "How many standard deviations a value sits above or below the mean: z = (x − μ) / σ.", s: "stats-1/z-scores-and-the-normal-distribution", l: "Z-Scores & The Normal Distribution" },
      { t: "Critical value", d: "The cutoff a test statistic must beat for significance at your chosen alpha — the table value (e.g. z = 1.96 for two-tailed α = .05).", s: "stats-1/hypothesis-testing-logic", l: "Hypothesis Testing Logic" },
      { t: "Rejection region", d: "The tail area(s) of the test statistic's distribution beyond the critical value; a statistic landing there means p < α, so you reject the null.", s: "stats-1/hypothesis-testing-logic", l: "Hypothesis Testing Logic" },
      { t: "One-tailed vs. two-tailed test", d: "Whether your alternative hypothesis predicts a direction (one tail) or just 'a difference' (both tails). Two-tailed is the cautious default.", s: "stats-1/hypothesis-testing-logic", l: "Hypothesis Testing Logic" },
      { t: "Welch's t-test", d: "The unequal-variances version of the independent t-test — no pooling, adjusted df. Robust enough that many stats programs make it the default.", s: "stats-1/independent-samples-t-test", l: "Independent Samples t-Test" },
      { t: "Mann-Whitney U test", d: "The rank-based alternative to the independent-samples t-test for two unrelated groups.", s: "stats-2/non-parametric-alternatives", l: "Non-Parametric Alternatives" },
      { t: "Wilcoxon signed-rank test", d: "The rank-based alternative for one-sample or paired designs, built on the signed ranks of the difference scores.", s: "stats-2/non-parametric-alternatives", l: "Non-Parametric Alternatives" },
      { t: "Kruskal-Wallis test", d: "The rank-based counterpart of one-way ANOVA for three or more independent groups.", s: "stats-2/non-parametric-alternatives", l: "Non-Parametric Alternatives" },
      { t: "Friedman test", d: "The rank-based counterpart of repeated-measures ANOVA for three or more within-person conditions.", s: "stats-2/non-parametric-alternatives", l: "Non-Parametric Alternatives" },
      { t: "Tukey's HSD", d: "A post-hoc procedure built for all pairwise comparisons after ANOVA, controlling the familywise error rate with less lost power than Bonferroni.", s: "stats-2/post-hoc-tests", l: "Post-Hoc Tests" },
      { t: "Cramér's V", d: "An effect size for chi-square tests of association, scaled 0–1, so a significant result can also be judged for strength.", s: "stats-2/chi-square-tests", l: "Chi-Square Tests" },
      { t: "Spearman rank correlation", d: "Pearson's r computed on ranks — captures any consistently rising or falling (monotone) relationship and resists outliers.", s: "stats-2/correlation", l: "Correlation" },
      { t: "Odds", d: "The probability of an event divided by the probability of its absence: p / (1 − p). The scale logistic regression works on (as log-odds).", s: "stats-3/logistic-regression", l: "Logistic Regression" },
      { t: "Sphericity", d: "The repeated-measures ANOVA assumption that all pairwise condition-difference scores have equal variance; violations get a Greenhouse–Geisser df correction.", s: "stats-2/repeated-measures-anova", l: "Repeated Measures ANOVA" },
      { t: "Simpson's paradox", d: "A trend that appears in aggregated data but reverses (or vanishes) within every subgroup, caused by an ignored lurking variable.", s: "stats-3/multiple-regression", l: "Multiple Regression" },
      { t: "Binomial distribution", d: "The distribution of the number of successes in n independent yes/no trials with success probability p.", s: "stats-1/probability-basics", l: "Probability Basics" },
      { t: "Poisson distribution", d: "The classic distribution for counts of events in a fixed window, with variance equal to its mean — the starting point for count GLMs.", s: "stats-4/generalized-linear-models", l: "Generalized Linear Models" },
      { t: "Construct", d: "An abstract idea a study aims to measure — stress, intelligence, aggression — that exists in theory and must be pinned to a concrete measure before it can be studied.", s: "methods/variables-and-operationalization", l: "Variables & Operationalization" },
      { t: "Operationalization", d: "Translating a construct into a specific, measurable procedure — e.g. defining 'stress' as salivary cortisol in µg/dL. One construct can be operationalized many ways.", s: "methods/variables-and-operationalization", l: "Variables & Operationalization" },
      { t: "Independent variable (IV)", d: "The presumed cause in a study — the variable you manipulate or compare across groups (e.g. drug vs. placebo).", s: "methods/variables-and-operationalization", l: "Variables & Operationalization" },
      { t: "Dependent variable (DV)", d: "The outcome you measure to see whether the independent variable had an effect.", s: "methods/variables-and-operationalization", l: "Variables & Operationalization" },
      { t: "Falsifiability", d: "The requirement that a scientific hypothesis make a risky prediction some possible result could refute. Unfalsifiable claims fit every outcome and so explain none.", s: "methods/from-question-to-hypothesis", l: "From Question to Hypothesis" },
      { t: "Reliability", d: "The consistency of a measure — does it give the same answer under the same conditions? Types include test–retest, inter-rater, and internal consistency.", s: "methods/reliability-and-validity", l: "Reliability & Validity" },
      { t: "Validity", d: "Whether a measure actually captures the construct it's meant to. Reliability is necessary for validity but never guarantees it.", s: "methods/reliability-and-validity", l: "Reliability & Validity" },
      { t: "Cronbach's alpha (α)", d: "A 0–1 index of a scale's internal consistency — how well its items hang together. Rises with both inter-item correlation and the number of items; α ≥ .70 is the common minimum.", s: "methods/reliability-and-validity", l: "Reliability & Validity" },
      { t: "Random assignment", d: "Allocating participants to conditions by chance (e.g. a coin flip). It balances known and unknown confounds in expectation, which is what lets an experiment claim the treatment caused the effect.", s: "methods/experimental-design-and-randomization", l: "Experiments & Random Assignment" },
      { t: "Random sampling", d: "Drawing participants from the population at random so the sample represents it. Protects external validity (generalization) — distinct from random assignment, which protects internal validity.", s: "methods/experimental-design-and-randomization", l: "Experiments & Random Assignment" },
      { t: "Internal validity", d: "Confidence that the treatment — not a confound — caused the observed difference. Random assignment is its strongest guarantee.", s: "methods/experimental-design-and-randomization", l: "Experiments & Random Assignment" },
      { t: "External validity", d: "How far a study's findings generalize beyond its particular sample, setting, and materials. Boosted by representative (random) sampling.", s: "methods/experimental-design-and-randomization", l: "Experiments & Random Assignment" },
      { t: "Placebo", d: "An inert comparison treatment given to a control group so the effect of merely believing one is being treated can be separated from the treatment's real effect.", s: "methods/experimental-design-and-randomization", l: "Experiments & Random Assignment" },
      { t: "Between-subjects design", d: "A design in which each participant experiences only one condition, so conditions are compared across different groups of people.", s: "methods/between-vs-within-designs", l: "Between vs Within Designs" },
      { t: "Within-subjects design", d: "A repeated-measures design in which each participant experiences every condition, serving as their own control. More efficient when conditions correlate strongly, but prone to order and carryover effects.", s: "methods/between-vs-within-designs", l: "Between vs Within Designs" },
      { t: "Counterbalancing", d: "Varying the order of conditions across participants (e.g. via a Latin square) so that order and practice effects cancel out on average rather than masquerading as a treatment effect.", s: "methods/between-vs-within-designs", l: "Between vs Within Designs" },
      { t: "Carryover effect", d: "When one condition influences responses in a later condition — a drug still active, a strategy just learned — contaminating within-subjects comparisons.", s: "methods/between-vs-within-designs", l: "Between vs Within Designs" },
      { t: "Quasi-experiment", d: "A study with a treatment, comparison, and outcome but no random assignment; the groups formed by choice or circumstance, so hidden differences remain a rival explanation.", s: "methods/quasi-experiments", l: "Quasi-Experiments & Natural Experiments" },
      { t: "Difference-in-differences", d: "A quasi-experimental estimator that subtracts a comparison group's before/after change from the treated group's, cancelling baseline gaps and shared trends — valid if trends would have stayed parallel.", s: "methods/quasi-experiments", l: "Quasi-Experiments & Natural Experiments" },
      { t: "Natural experiment", d: "A quasi-experiment in which an outside event (a lottery, law, or arbitrary cutoff) assigns the treatment as-good-as-randomly, letting researchers exploit an accident they never manipulated.", s: "methods/quasi-experiments", l: "Quasi-Experiments & Natural Experiments" },
      { t: "Regression discontinuity", d: "A design that compares units just above and just below a strict treatment cutoff; since they are near-identical by luck of the threshold, a jump at the cutoff is credibly the treatment's effect.", s: "methods/quasi-experiments", l: "Quasi-Experiments & Natural Experiments" },
      { t: "Cohort study", d: "An observational design that enrols exposed and unexposed people without the outcome and follows them forward, measuring incidence — so it yields a risk ratio directly and fixes the time-order. Slow and poor for rare outcomes.", s: "methods/observational-designs", l: "Observational Designs" },
      { t: "Case-control study", d: "An observational design that starts from people who already have the outcome (cases) plus controls, then looks backward at exposure. Efficient for rare outcomes, but because the case:control ratio is chosen, only an odds ratio is estimable.", s: "methods/observational-designs", l: "Observational Designs" },
      { t: "Cross-sectional study", d: "A one-snapshot design measuring exposure and outcome at the same moment. Great for prevalence, but cannot establish which came first, so it can't show cause and effect.", s: "methods/observational-designs", l: "Observational Designs" },
      { t: "Survivorship bias", d: "The error of studying only the units that remained in the data (survivors), missing those that dropped out for reasons tied to the outcome — making the sample look complete while it silently excludes the informative cases.", s: "methods/observational-designs", l: "Observational Designs" },
      { t: "Simple random sampling", d: "A probability method in which every member of the population has an equal chance of selection. The unbiased benchmark, but it needs a complete list and can, by luck, miss small subgroups.", s: "methods/sampling-methods", l: "Sampling Methods" },
      { t: "Stratified sampling", d: "Dividing the population into strata (e.g. age bands, regions) and sampling within each, usually proportionally. Guarantees coverage and gives a more precise estimate than simple random sampling for the same n.", s: "methods/sampling-methods", l: "Sampling Methods" },
      { t: "Cluster sampling", d: "Dividing the population into many natural clusters (schools, blocks), randomly selecting a few whole clusters, and measuring everyone in them. Cheap over spread-out populations but far noisier, since cluster members resemble one another.", s: "methods/sampling-methods", l: "Sampling Methods" },
      { t: "Convenience sampling", d: "A non-probability method that recruits whoever is easiest to reach. Its bias does not shrink with sample size — more data just gives a more precise wrong answer.", s: "methods/sampling-methods", l: "Sampling Methods" },
      { t: "Sampling frame", d: "The actual list of units you draw a sample from. When it omits part of the target population (coverage error), even a perfectly random draw can't represent whoever the frame left out.", s: "methods/sampling-methods", l: "Sampling Methods" },
      { t: "Nonresponse bias", d: "The distortion that arises when people who don't answer a survey differ systematically from those who do, so the realised sample drifts from the intended one.", s: "methods/sampling-methods", l: "Sampling Methods" },
      { t: "Likert scale", d: "An ordered rating scale (e.g. Strongly disagree → Strongly agree). Best practice is 5–7 balanced, word-labelled points; the choice of a neutral midpoint (odd vs even) is a genuine design decision.", s: "methods/survey-and-questionnaire-design", l: "Designing Surveys & Questionnaires" },
      { t: "Double-barreled question", d: "A survey item that asks about two things at once ('the pay and the hours'), so respondents who feel differently about the halves can't answer honestly. Fix by splitting into separate items.", s: "methods/survey-and-questionnaire-design", l: "Designing Surveys & Questionnaires" },
      { t: "Leading question", d: "An item worded to signal the expected answer ('Don't you agree that…?'), biasing responses toward it. The remedy is neutral phrasing.", s: "methods/survey-and-questionnaire-design", l: "Designing Surveys & Questionnaires" },
      { t: "Social desirability bias", d: "The tendency to answer sensitive questions to look good rather than truthfully. Reduced by genuine, stated anonymity, non-identifying items, and softer framing.", s: "methods/survey-and-questionnaire-design", l: "Designing Surveys & Questionnaires" },
      { t: "Acquiescence bias", d: "The tendency of some respondents to agree with statements regardless of content. Reverse-coded items expose it, since straight-line agreeing then contradicts itself.", s: "methods/survey-and-questionnaire-design", l: "Designing Surveys & Questionnaires" },
      { t: "Blinding (masking)", d: "Hiding condition assignments to prevent bias. Single-blind keeps participants unaware (stopping demand characteristics and the placebo effect); double-blind keeps the interacting researchers unaware too (also stopping experimenter-expectancy bias).", s: "methods/bias-and-blinding", l: "Bias, Blinding & Demand Characteristics" },
      { t: "Demand characteristics", d: "Cues that let participants guess a study's purpose, so they respond to their guess about what's wanted rather than behaving naturally — potentially manufacturing or erasing an effect on their own.", s: "methods/bias-and-blinding", l: "Bias, Blinding & Demand Characteristics" },
      { t: "Experimenter-expectancy effect", d: "When a researcher's hopes unconsciously influence how participants behave or how outcomes are measured (the 'Clever Hans' mechanism). Double-blinding is the standard defence.", s: "methods/bias-and-blinding", l: "Bias, Blinding & Demand Characteristics" },
      { t: "Placebo effect", d: "A real change in outcome produced by the belief that one is being treated, independent of any active ingredient. Its evil twin, the nocebo effect, produces belief-driven harm. Isolated with a placebo control and blinding.", s: "methods/bias-and-blinding", l: "Bias, Blinding & Demand Characteristics" },
      { t: "Selection bias", d: "Systematic error arising when the people who end up in a study differ from the population of interest — e.g. recruiting exercisers at a gym. Unlike random noise, it does not shrink with sample size.", s: "methods/bias-and-blinding", l: "Bias, Blinding & Demand Characteristics" },
      { t: "Replication crisis", d: "The finding that a large share of published results — famously fewer than 40% of 100 psychology studies in 2015 — fail to reproduce, driven by p-hacking, forking paths, publication bias, and low power rather than fraud.", s: "methods/the-replication-crisis", l: "The Replication Crisis" },
      { t: "p-hacking", d: "Trying analyses (dropping outliers, adding covariates, testing subgroups, adding participants) until one crosses p < .05. Usually motivated flexibility rather than fraud, but it invalidates the p-value.", s: "methods/the-replication-crisis", l: "The Replication Crisis" },
      { t: "Garden of forking paths", d: "The idea that a dataset admits many defensible analyses; if the one you run depends on the data, your p-values are invalid even after a single test — because different data would have led to different, equally reasonable choices.", s: "methods/the-replication-crisis", l: "The Replication Crisis" },
      { t: "Publication bias", d: "The tendency for significant, novel results to be published while null findings sit in the file drawer, so the literature over-represents flukes and overstates effects. The asymmetry a funnel plot is built to reveal.", s: "methods/the-replication-crisis", l: "The Replication Crisis" },
      { t: "HARKing", d: "Hypothesising After the Results are Known — presenting a pattern found by exploration as though it had been predicted in advance, converting a chance blip into a spuriously 'confirmed' theory.", s: "methods/the-replication-crisis", l: "The Replication Crisis" },
      { t: "Researcher degrees of freedom", d: "The many small, individually defensible analytic choices — exclusions, transformations, which covariates or measures, when to stop collecting — that collectively inflate false positives. The raw material of the garden of forking paths.", s: "methods/the-replication-crisis", l: "The Replication Crisis" },
      { t: "Preregistration", d: "Depositing a timestamped hypothesis and analysis plan before collecting or looking at the data, so the analysis can't be steered by the result. Turns a flexible hunt into a genuine confirmatory test.", s: "methods/preregistration-and-open-science", l: "Preregistration & Open Science" },
      { t: "Registered report", d: "A publishing format in which a journal peer-reviews a study's plan before the data exist and grants in-principle acceptance regardless of the eventual results — directly neutralising publication bias.", s: "methods/preregistration-and-open-science", l: "Preregistration & Open Science" },
      { t: "Confirmatory vs exploratory analysis", d: "Confirmatory analysis tests a prediction fixed in advance and yields a valid p-value; exploratory analysis searches the data for patterns and generates hypotheses. Both are legitimate — the crisis came from disguising one as the other.", s: "methods/preregistration-and-open-science", l: "Preregistration & Open Science" },
      { t: "Tidy data", d: "A standard table shape where each variable is a column, each observation a row, and each cell one value. Its dull consistency is what lets every downstream tool filter, group, plot, and model the data without reshaping first.", s: "data/tidy-data", l: "Tidy Data" },
      { t: "Wide vs long format", d: "Two layouts for the same data: wide spreads one variable across several columns (Quiz 1, Quiz 2, Final); long stacks them into a key column and a value column. Tidy data is long; some tools (e.g. repeated-measures ANOVA in SPSS) want wide.", s: "data/tidy-data", l: "Tidy Data" },
      { t: "Codebook", d: "A variable-by-variable dictionary recording each column's name, label, type, units or allowed values, and missing codes. It keeps a dataset legible to future-you and is the reference your validation rules are built from.", s: "data/codebooks-and-documentation", l: "Codebooks & Documentation" },
      { t: "Missing data code", d: "How 'no answer' is stored. A blank cell or NA is safest; numeric codes like -99 or 999 are landmines because, undeclared, the software averages them in as real values. Never use 0, which is a legitimate value for many variables.", s: "data/codebooks-and-documentation", l: "Codebooks & Documentation" },
      { t: "Reverse coding", d: "Flipping a negatively worded item's scale (on a 1–5 scale, 6 − x) so all items point the same way before they're combined into a composite. Skipping it quietly cancels out the reversed items and deflates a scale's reliability.", s: "data/codebooks-and-documentation", l: "Codebooks & Documentation" },
      { t: "Data validation", d: "Catching errors at entry by declaring what a legal value looks like: range checks (0 ≤ age ≤ 120), allowed-value sets (sex ∈ {M, F, Other}), and cross-field logic (birth year = year − age). Rules never tire the way proofreading does.", s: "data/data-entry-and-validation", l: "Data Entry & Validation" },
      { t: "Range check", d: "A validation rule that a numeric field must fall within plausible bounds. It flags impossible values — an age of 511, a 4 ms reaction time — that would otherwise drag means, inflate SDs, and pose as influential outliers.", s: "data/data-entry-and-validation", l: "Data Entry & Validation" },
      { t: "Double data entry", d: "Entering the same data twice and comparing the versions cell by cell; disagreements pinpoint typos to check against the source. Standard in clinical trials, it sharply cuts the undetected-error rate.", s: "data/data-entry-and-validation", l: "Data Entry & Validation" },
      { t: "Data-cleaning pipeline", d: "A principled loop — inspect, document the issues, fix via script, re-inspect, log the decision — run the same way every time. Keeping the raw file read-only and every fix in code makes cleaning reproducible, reversible, and auditable.", s: "data/data-cleaning-workflow", l: "The Cleaning Workflow" },
      { t: "Fuzzy duplicate", d: "Two rows that mean the same record but aren't byte-identical — 'Ann Lee' vs 'Ann Lee ' with a trailing space, or a near-repeat. Unlike exact duplicates they need investigation before removal, and long-format data legitimately repeats IDs across rows.", s: "data/data-cleaning-workflow", l: "The Cleaning Workflow" },
      { t: "Sensitivity analysis", d: "Rerunning an analysis under a different reasonable choice — most often with and without a suspicious outlier — and reporting both. It shows the reader how much a conclusion depends on one decision, and is the honest alternative to silently deleting inconvenient points.", s: "data/outliers-in-practice", l: "Outliers: Detect, Investigate, Decide" },
      { t: "Winsorising", d: "Capping extreme values at a chosen percentile (or the next-highest legitimate value) instead of deleting them. It keeps the row and the sample size while removing the leverage a single giant value has over the mean and SD.", s: "data/outliers-in-practice", l: "Outliers: Detect, Investigate, Decide" },
      { t: "1.5 × IQR rule", d: "Flags any value below Q1 − 1.5·IQR or above Q3 + 1.5·IQR — the fence that draws a boxplot's whiskers. Built from quartiles, it resists the very extremes it hunts, unlike the mean-and-SD z-score rule an outlier can inflate to hide itself.", s: "data/outliers-in-practice", l: "Outliers: Detect, Investigate, Decide" },
      { t: "Log transformation", d: "Replacing x with log(x) to pull in a long right tail; it turns multiplicative structure into additive and can restore normality without discarding any data. Needs positive values (use log(x+1) for zeros); the mean of the logs back-transforms to the geometric mean.", s: "data/transformations-and-recoding", l: "Transformations & Recoding" },
      { t: "Median split", d: "Chopping a continuous predictor at its median into 'high' and 'low'. Tidy-looking but wasteful: it discards the variation within each half, shrinking a correlation to roughly 0.80 of its value — about the power of throwing away a third of your data. Keep variables continuous.", s: "data/transformations-and-recoding", l: "Transformations & Recoding" },
      { t: "Composite score", d: "A single score per person formed by averaging (or summing) several items that measure one construct, once every item is reverse-coded to point the same way. A mean tolerates the odd missing item better than a sum.", s: "data/transformations-and-recoding", l: "Transformations & Recoding" },
      { t: "Pivoting (reshaping)", d: "Moving a dataset between wide (one row per subject, timepoints as columns) and long (one row per measurement) form. pivot_longer/melt turns column headers into a key column of values; pivot_wider/pivot spreads them back. Lossless and reversible when each row is uniquely keyed.", s: "data/wide-vs-long-data", l: "Wide vs Long Data" },
      { t: "Join (merge)", d: "Combining two tables by matching rows on a shared key, usually a participant ID — never by row order. The join type decides what happens to keys present in only one table.", s: "data/merging-datasets", l: "Merging Datasets" },
      { t: "Inner vs left join", d: "An inner join keeps only keys present in both tables (complete cases); a left join keeps every row of the main table and fills NA where the other has no match, so no one is dropped. Left is the everyday default; inner is for complete cases only.", s: "data/merging-datasets", l: "Merging Datasets" },
      { t: "Many-to-many join", d: "What happens when the join key repeats in both tables: every copy matches every copy, multiplying rows. The classic silent bug — a clean 200-person dataset becomes 380 rows. Check key uniqueness and the before/after row count.", s: "data/merging-datasets", l: "Merging Datasets" },
      { t: "Reproducible workflow", d: "An analysis captured as scripts that turn immutable raw data into every reported number the same way on any machine. Reproducible, correctable, and auditable — the opposite of a session of unrecorded point-and-click. The test: could a stranger rerun it from your files alone?", s: "data/reproducible-workflows", l: "Reproducible Workflows" },
      { t: "Random seed", d: "A fixed starting value for the random-number generator (set.seed(1), default_rng(1)) that makes every bootstrap, simulation, shuffle, or random split come out identical on every run. Unseeded randomness is a classic source of irreproducibility.", s: "data/reproducible-workflows", l: "Reproducible Workflows" },
      { t: "De-identification", d: "Removing direct identifiers (name, email, address) from a dataset. Weaker than anonymization: quasi-identifiers like age, sex, and ZIP can still re-identify people in combination (Sweeney found ~87% of Americans unique on ZIP + birth date + sex).", s: "data/data-privacy-basics", l: "Data Privacy Basics" },
      { t: "Quasi-identifier", d: "A field that doesn't identify someone alone but narrows the field fast in combination with others — age, sex, ZIP, job, dates. The raw material of re-identification, and what k-anonymity coarsens to protect people.", s: "data/data-privacy-basics", l: "Data Privacy Basics" },
      { t: "k-anonymity", d: "A privacy yardstick: a dataset is k-anonymous if every person shares their quasi-identifier combination with at least k − 1 others, so no record can be narrowed to a group smaller than k. Higher k is safer; raise it by generalizing (age → decade) or suppressing fields.", s: "data/data-privacy-basics", l: "Data Privacy Basics" },
      { t: "Pseudonymization", d: "Replacing direct identifiers with a code while a separate, secured key still links codes to people. Reversible by design (useful for follow-ups) — so the data are not anonymous while the key exists. Store the key apart from the data with tight access.", s: "data/data-privacy-basics", l: "Data Privacy Basics" },
      { t: "Belmont Report", d: "The 1979 U.S. report, written after Tuskegee, that distilled research ethics into three principles — respect for persons, beneficence, and justice — each mapped to a practical requirement (informed consent, risk–benefit assessment, fair participant selection). Still the framework every ethics committee uses.", s: "ethics/why-research-ethics", l: "Why Research Ethics Exists" },
      { t: "Beneficence", d: "The Belmont principle of doing no harm while maximizing likely benefits and minimizing possible harms — the risk–benefit weighing at the heart of every ethics review.", s: "ethics/why-research-ethics", l: "Why Research Ethics Exists" },
      { t: "Respect for persons", d: "The Belmont principle that people are autonomous agents who decide for themselves, with extra protection for those of diminished autonomy. In practice it becomes informed consent.", s: "ethics/why-research-ethics", l: "Why Research Ethics Exists" },
      { t: "Informed consent", d: "A participant's genuine agreement to take part, valid only when all three hold: they are adequately informed, they actually comprehend it, and they choose voluntarily (free to refuse or withdraw). A signature missing any one is not valid consent.", s: "ethics/informed-consent-and-irb", l: "Informed Consent & Ethics Committees" },
      { t: "Assent", d: "A minor's own age-appropriate agreement to take part, required alongside a guardian's consent. A parent's yes does not override a child's refusal; the same logic covers adults with diminished capacity.", s: "ethics/informed-consent-and-irb", l: "Informed Consent & Ethics Committees" },
      { t: "Institutional Review Board (IRB)", d: "The committee (a Research Ethics Committee outside the U.S.) that reviews a study before data collection, checking that risks are justified, consent is genuine, recruitment isn't coercive, and data are protected. Review is scaled by risk: exempt, expedited, or full-board.", s: "ethics/informed-consent-and-irb", l: "Informed Consent & Ethics Committees" },
      { t: "Deception (in research)", d: "Withholding or misrepresenting information to participants. Permissible only when there is no reasonable alternative, harm is minimal, and a full debriefing follows — and it carries a trust cost, feeding suspicion that reintroduces demand characteristics.", s: "ethics/deception-and-debriefing", l: "Deception & Debriefing" },
      { t: "Debriefing", d: "The post-study session that repays the debt of deception: it reveals and explains what was misrepresented, corrects false beliefs, offers the right to withdraw one's data, and checks on wellbeing — so participants leave no worse off than they arrived.", s: "ethics/deception-and-debriefing", l: "Deception & Debriefing" },
      { t: "Confidentiality", d: "The promise to protect identifiable data and never disclose an individual's responses. Distinct from anonymity: confidential data can still be traced to a person, so you hold the link and guard it. The promise is strong but not absolute — a credible risk of serious harm can override it, which should be flagged in the consent form.", s: "ethics/privacy-and-confidentiality", l: "Privacy & Confidentiality" },
      { t: "Data minimization", d: "The data-protection principle of collecting only the variables your research question actually needs. Every extra field is a liability to protect and a handle for re-identification, so the safest data are the data you never gathered.", s: "ethics/privacy-and-confidentiality", l: "Privacy & Confidentiality" },
      { t: "Questionable research practices (QRPs)", d: "The grey-zone practices between honest flexibility and fraud that inflate false positives using real data — optional stopping, selective outcome reporting, HARKing, p-hacking. Rarely felt as cheating, widespread in surveys, and the main engine of the replication crisis.", s: "ethics/questionable-research-practices", l: "Questionable Research Practices" },
      { t: "Optional stopping", d: "Repeatedly testing as data arrive and stopping the moment p < .05 (or adding 'just a few more' participants when it isn't). Each extra look is another chance to cross the threshold, so it turns a nominal 5% false-positive rate into 20% or more. Planned interim analyses with corrected thresholds are the legitimate alternative.", s: "ethics/questionable-research-practices", l: "Questionable Research Practices" },
      { t: "Plagiarism", d: "Presenting someone's words, ideas, or work as your own. Forms include verbatim copying, mosaic/patchwriting (synonym-swapping while keeping structure), self-plagiarism (reusing your own submitted work as new), and idea theft. A citation covers the idea; quotation marks cover the exact words — you need both.", s: "ethics/plagiarism-authorship-and-citation", l: "Plagiarism, Authorship & Citation" },
      { t: "Self-plagiarism", d: "Reusing your own previously submitted or published work as though it were new, such as recycling a graded essay into a thesis without disclosure. Fixed by disclosing, citing the earlier work, and reworking it for the new context — not by swapping a few words.", s: "ethics/plagiarism-authorship-and-citation", l: "Plagiarism, Authorship & Citation" },
      { t: "Authorship (ICMJE criteria)", d: "Authorship requires all four: a substantial contribution, drafting or critically revising the work, approving the final version, and accountability for it. Credit and responsibility travel together, so it can't be handed out as a favour. People who helped but don't meet all four belong in the acknowledgements.", s: "ethics/plagiarism-authorship-and-citation", l: "Plagiarism, Authorship & Citation" },
      { t: "Gift and ghost authorship", d: "Two ways a byline misrepresents who did the work: gift (honorary) authorship lists someone who didn't meet the criteria — a lab head or a favour — while ghost authorship omits someone who did, such as the student who ran the study. Both distort responsibility; the fix is to agree authorship and order openly and early.", s: "ethics/plagiarism-authorship-and-citation", l: "Plagiarism, Authorship & Citation" },
      { t: "Hallucination (AI)", d: "An AI language model producing fluent, confident output that is simply false — most notoriously fabricated citations for papers that don't exist, plus invented statistics and 'facts'. It's a structural feature of predicting plausible text, not an occasional bug, which is why every AI-supplied fact, number, and reference must be independently verified before you use it.", s: "ethics/ai-in-research-ethics", l: "Using AI Tools Ethically" },
      { t: "Fabrication and falsification", d: "The two core forms of research misconduct about the data itself: fabrication invents data or results that were never collected; falsification alters real data by changing values, deleting cases, or doctoring images. Distinct from questionable research practices, which bend the analysis of genuinely collected data — fraud reports numbers that never existed.", s: "ethics/fraud-and-self-correction", l: "Fraud & How Science Self-Corrects" },
      { t: "Retraction", d: "The formal withdrawal of a published paper from the scientific record because it can no longer be trusted — through fraud, serious error, or unreliable data. The article usually stays visible, stamped 'retracted' with a notice explaining why, but should no longer be cited as valid evidence. Not a synonym for fraud: many retractions are honest mistakes.", s: "ethics/fraud-and-self-correction", l: "Fraud & How Science Self-Corrects" },
      { t: "GRIM test", d: "Granularity-Related Inconsistency of Means: an arithmetic check for means of whole-number data. Since a mean is an integer total divided by n, only fractions with denominator n can occur, so a reported mean that falls between reachable values (e.g. 5.19 from 28 responses) is impossible — a red flag for a typo or fabrication. Only informative when n < 10^(decimals reported).", s: "ethics/fraud-and-self-correction", l: "Fraud & How Science Self-Corrects" },
      { t: "Prediction vs. inference", d: "The two goals a model can serve (Breiman's 'two cultures'). Inference/explanation estimates which variables matter and how much, with uncertainty (coefficients, CIs, p-values); prediction estimates the outcome for new cases, judged by held-out error. The same model can serve either, but each goal favours a different level of complexity.", s: "ml/prediction-vs-explanation", l: "Prediction vs Explanation" },
      { t: "Data leakage", d: "When information from the test set (or the future) sneaks into training, so a model is secretly graded on data it already saw — inflating the reported score while true performance stays low. Classic causes: preprocessing before the split, the same subject in both sets, and tuning on the test set.", s: "ml/train-test-split-and-generalization", l: "Train/Test Splits & Generalization" },
      { t: "Train/test split", d: "Holding back part of the data to evaluate a model honestly: the model learns on the training set and is scored, once, on the untouched test set. Stratify to preserve class proportions, and split by subject when one person contributes many rows, so generalization is measured on genuinely unseen cases.", s: "ml/train-test-split-and-generalization", l: "Train/Test Splits & Generalization" },
      { t: "Regularization", d: "Adding a penalty on coefficient size to the fitting objective so coefficients are deliberately shrunk toward zero. It trades a little bias for a large drop in variance, curbing overfitting when predictors are many or correlated; the penalty strength λ is chosen by cross-validation.", s: "ml/regularization-ridge-and-lasso", l: "Regularization: Ridge & Lasso" },
      { t: "Ridge regression (L2)", d: "Regularized regression that penalizes the sum of squared coefficients. It shrinks every coefficient smoothly toward zero but never exactly to zero, keeping all predictors in the model — especially useful when predictors are correlated, where it shares the coefficient rather than picking one.", s: "ml/regularization-ridge-and-lasso", l: "Regularization: Ridge & Lasso" },
      { t: "Lasso (L1)", d: "Regularized regression that penalizes the sum of absolute coefficients, driving weak ones to exactly zero. This performs automatic variable selection, yielding a sparse, interpretable model. Among correlated predictors it tends to keep one and zero the rest; elastic net blends lasso and ridge.", s: "ml/regularization-ridge-and-lasso", l: "Regularization: Ridge & Lasso" },
      { t: "Confusion matrix", d: "The 2×2 table of a classifier's predictions against the truth: true positives, false positives, false negatives, and true negatives. Every classification metric — accuracy, precision, recall, specificity, F1 — is just a ratio of these four counts, so reading the matrix directly tells you which kind of error the model makes.", s: "ml/classification-metrics", l: "Classification Metrics & the Accuracy Trap" },
      { t: "Precision and recall", d: "Two views of a classifier's positive predictions. Recall (sensitivity, true-positive rate) = TP/(TP+FN): of the real positives, how many were caught. Precision = TP/(TP+FP): of everything flagged, how many were right. Screening prizes recall (don't miss a case); spam filtering prizes precision (don't bin a real email). F1 is their harmonic mean.", s: "ml/classification-metrics", l: "Classification Metrics & the Accuracy Trap" },
      { t: "Accuracy trap", d: "When high overall accuracy hides a useless model because one class is rare. If 2% of cases are positive, always predicting 'negative' scores 98% accuracy while catching nothing. Because accuracy weights every case equally, an imbalanced base rate lets the majority class dominate — report recall and precision instead.", s: "ml/classification-metrics", l: "Classification Metrics & the Accuracy Trap" },
      { t: "ROC curve", d: "A plot of true-positive rate against false-positive rate as the decision threshold sweeps across every value. The closer the curve hugs the top-left corner the better; the 45° diagonal is chance. It lets you compare classifiers without first committing to a single operating threshold.", s: "ml/roc-curves-and-auc", l: "ROC Curves & AUC" },
      { t: "AUC (area under the ROC curve)", d: "A single-number summary of a ROC curve, between 0 and 1. It equals the probability that the model scores a randomly chosen positive case above a randomly chosen negative one: 0.5 is chance, 0.9+ is excellent. Being threshold-free and base-rate-independent, it measures ranking ability rather than accuracy at one cutoff.", s: "ml/roc-curves-and-auc", l: "ROC Curves & AUC" },
      { t: "Decision tree", d: "A model that classifies (or predicts) by a sequence of yes/no questions on one feature at a time, splitting the data into ever-purer groups (chosen to reduce Gini impurity) and carving the feature space into labelled rectangles. Highly interpretable — a readable flowchart — but a single tree is unstable and its depth is a direct overfitting dial.", s: "ml/decision-trees", l: "Decision Trees" },
      { t: "Gini impurity", d: "A measure of how mixed a group's class labels are: the chance you'd mislabel a random member if you guessed in proportion to the group's mix. It is 0 for a perfectly pure group and 0.5 for a 50/50 two-class group. Decision trees pick each split to reduce the size-weighted Gini impurity of the resulting groups the most.", s: "ml/decision-trees", l: "Decision Trees" },
      { t: "Random forest", d: "An ensemble that averages the votes of many decision trees, each grown on a bootstrap sample of the data using a random subset of features at every split. Bagging plus feature randomness makes the trees disagree, so averaging cancels their individual noise — a large drop in variance that turns unstable trees into one of the strongest low-tuning predictors, at the cost of interpretability.", s: "ml/random-forests-and-ensembles", l: "Random Forests & Ensembles" },
      { t: "Bagging (bootstrap aggregating)", d: "Training each model in an ensemble on its own bootstrap sample (n rows drawn with replacement) and averaging their predictions. Because the samples differ, the models make partly independent errors that cancel on averaging, reducing variance. It is the core idea behind random forests.", s: "ml/random-forests-and-ensembles", l: "Random Forests & Ensembles" },
      { t: "Out-of-bag (OOB) error", d: "A free validation estimate from bagging: each bootstrap sample omits about 37% of rows, so every row can be predicted using only the trees that never saw it. Comparing those predictions to the truth approximates cross-validated test error without a separate holdout set.", s: "ml/random-forests-and-ensembles", l: "Random Forests & Ensembles" },
      { t: "Variable importance", d: "A ranking of how much each predictor helped an ensemble predict, via impurity reduction across splits or, more reliably, permutation (shuffle a column and measure the accuracy drop). Useful but biased toward high-cardinality predictors and distorted by correlation — and it measures predictive help, not causation.", s: "ml/random-forests-and-ensembles", l: "Random Forests & Ensembles" },
      { t: "k-nearest neighbours (k-NN)", d: "A nonparametric method that classifies a new point by the majority vote of its k closest training points (or averages them, for regression). It stores the data instead of fitting parameters; k is the smoothness dial, features must be scaled because distance is scale-sensitive, and it degrades in high dimensions.", s: "ml/knn-and-distance", l: "k-NN & Why Distance Gets Weird" },
      { t: "Curse of dimensionality", d: "The ways low-dimensional intuition breaks as features multiply: volume explodes, data becomes sparse, and all points drift toward being equally far apart, so 'nearest' loses meaning and distance-based methods fail. The ball inside a unit cube fills ~52% of it in 3-D but ~0.25% in 10-D. Fixes: dimensionality reduction and feature selection.", s: "ml/knn-and-distance", l: "k-NN & Why Distance Gets Weird" },
      { t: "k-means clustering", d: "An unsupervised algorithm that partitions unlabelled data into k clusters by alternating two steps until stable: assign each point to the nearest centroid, then move each centroid to its cluster's mean. Fast and useful, but it assumes convex, roughly spherical clusters, needs you to choose k, and is sensitive to initialization.", s: "ml/clustering-kmeans", l: "Clustering & k-Means" },
      { t: "Elbow method", d: "A heuristic for choosing k in k-means: plot the within-cluster sum of squares against k and look for the 'elbow' where the curve stops dropping steeply. Beyond that bend, extra clusters buy little, so it marks a k that captures the structure without over-splitting — though the bend is often ambiguous, so pair it with the silhouette and theory.", s: "ml/clustering-kmeans", l: "Clustering & k-Means" },
      { t: "Dimensionality reduction", d: "Compressing data with many variables into a few new ones you can plot or model, while preserving as much structure as possible. Linear methods like PCA rotate onto directions of maximum variance and keep distances honest; nonlinear methods like t-SNE and UMAP reveal local structure vividly but distort global geometry. It tames the curse of dimensionality and makes high-dimensional data visible.", s: "ml/dimensionality-reduction", l: "Dimensionality Reduction" },
      { t: "t-SNE / UMAP", d: "Nonlinear dimensionality-reduction methods that build a 2-D layout preserving each point's local neighbourhood, so clusters pop out visibly. Excellent for SEEING structure but not for measuring it: cluster sizes, between-cluster distances, and even the number of clumps change with the perplexity (or n_neighbors) setting and the random seed, so never run statistics on the coordinates.", s: "ml/dimensionality-reduction", l: "Dimensionality Reduction" },
      { t: "Artificial neuron", d: "The building block of a neural network: it takes a weighted sum of its inputs plus a bias and passes the total through an activation (squashing) function. With a sigmoid activation this is exactly logistic regression, and one neuron draws a single straight decision boundary — the power of networks comes from wiring many together.", s: "ml/neural-networks-intuition", l: "Neural Networks: The Intuition" },
      { t: "Gradient descent", d: "The workhorse training algorithm: picture the loss as a landscape over the model's weights, read the local downhill slope (the gradient), and take a small step that way, repeating until the loss flattens. The step size is the learning rate — too small and it crawls, too large and it overshoots and diverges. Backpropagation is how the gradients are computed efficiently through a network's layers.", s: "ml/neural-networks-intuition", l: "Neural Networks: The Intuition" },
      { t: "Large language model (LLM)", d: "A neural network trained to predict the next token (word-piece) over a vast corpus; generating text is just doing that repeatedly. This makes it fluent and useful, but it stores patterns rather than facts and optimizes for plausibility, not truth — so fabricated facts and citations (hallucinations) are structural, and every output must be verified. It cannot be an author because it cannot be accountable.", s: "ml/llms-and-ai-in-research", l: "LLMs & AI in Your Research Workflow" },
      { t: "IMRaD", d: "The standard structure of an empirical paper — Introduction, Methods, Results, and Discussion — with one job each: why the study, what you did, what you found, and what it means. It follows an 'hourglass' shape: broad context narrowing to a hypothesis, the specific study in the middle, then widening back out to implications.", s: "writing/imrad-structure", l: "The IMRaD Structure" },
      { t: "APA style", d: "The American Psychological Association's rules for formatting and reporting, ubiquitous in the social sciences. For statistics: italicise Latin symbols (t, F, r, M, SD, d, N) but not Greek (α, β, χ², η²); drop leading zeros only on numbers bounded by 1 (p, r); floor tiny p-values at p < .001 and never write p = .000; report df in parentheses.", s: "writing/reporting-statistics-apa", l: "Reporting Statistics in APA Style" },
      { t: "Truncated axis", d: "A chart whose value axis starts somewhere other than zero, so bar lengths (or gaps between lines) are no longer proportional to the numbers. It exaggerates small differences into dramatic-looking ones while every plotted value stays technically correct — the commonest way an honest result is visually oversold. Bar charts should almost always start at 0.", s: "writing/tables-and-figures", l: "Tables & Figures That Don't Lie" },
      { t: "Chartjunk", d: "Ink that adds no information — fake 3-D, gradients, drop shadows, heavy gridlines, decorative rainbow palettes. Coined by Edward Tufte, it clutters a figure and can actively mislead (3-D distorts which bar looks taller). The fix is restraint: one flat colour, minimal gridlines, and every mark earning its place.", s: "writing/tables-and-figures", l: "Tables & Figures That Don't Lie" },
      { t: "Results section", d: "The part of a paper that reports what the analyses found — the statistics, in plain past-tense sentences — and nothing about what they mean. Each analysis is one sentence: what was tested, the descriptives, the test statistic with its df and exact p, and the effect size. Interpretation is deferred to the Discussion.", s: "writing/writing-results", l: "From Output to Results Section" },
      { t: "Marginal significance", d: "The discouraged habit of describing a non-significant result — usually p between .05 and .10 — as 'approaching' or 'a trend toward' significance. Significance is a threshold set in advance, so p = .06 simply didn't cross it. Report the exact p-value and the effect size with its confidence interval, and interpret honestly instead.", s: "writing/nonsignificant-results", l: "Writing About Non-Significant Results" },
      { t: "Absence of evidence", d: "The principle that a non-significant result (p > .05) is not proof that an effect is zero — it may just mean the study was too small to detect a real effect. 'Absence of evidence is not evidence of absence.' Only a tight confidence interval hugging zero lets you argue that an effect is negligible.", s: "writing/nonsignificant-results", l: "Writing About Non-Significant Results" },
      { t: "Equivalence testing", d: "An approach that flips the usual question from 'is the effect exactly zero?' to 'can we rule out effects large enough to matter?'. A non-significant result with a narrow confidence interval close to zero supports practical equivalence; a wide interval does not. It is the rigorous way to argue for 'no meaningful difference.'", s: "writing/nonsignificant-results", l: "Writing About Non-Significant Results" },
      { t: "Calibration (of claims)", d: "Matching the strength of a written claim to the strength of the evidence: the verb to the design (correlational data earns 'was associated with,' not 'causes'), the adjective to the effect size ('modest,' not 'strong,' for r = .28), and the scope to the sample (a group average is not 'every' person). Over- and under-claiming both break calibration.", s: "writing/discussion-and-limitations", l: "Discussion & Limitations" },
      { t: "Abstract", d: "The roughly 150–250-word summary that opens a paper — and the part most readers actually read. A complete abstract makes five moves: context (the gap), aim (the question), method (who and how), a result stated with numbers, and a calibrated conclusion. Write it last, once the final results and conclusion are known, and give the paper a findable, keyword-rich title.", s: "writing/abstracts-and-titles", l: "Abstracts & Titles" },
      { t: "Internal consistency (of a paper)", d: "Whether a paper agrees with itself — the sample size in the abstract matches the method, the degrees of freedom fit the reported n and design, the same statistic reads identically in every section, and every table, figure, and citation is accounted for. Graders check it first because a contradiction is quick to spot and casts doubt on everything else.", s: "writing/final-checklist", l: "The Final Checklist" }
    ];

    var host = document.getElementById("gloss-host");
    var countEl = document.getElementById("gloss-count");
    var filter = document.getElementById("gloss-filter");
    function slugify(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }

    function render(q) {
      q = (q || "").trim().toLowerCase();
      var matches = TERMS.filter(function (x) {
        return !q || x.t.toLowerCase().indexOf(q) >= 0 || x.d.toLowerCase().indexOf(q) >= 0;
      }).sort(function (a, b) { return a.t.localeCompare(b.t); });

      countEl.textContent = matches.length + " of " + TERMS.length + " terms";
      if (!matches.length) { host.innerHTML = '<p class="gloss-empty">No terms match “' + q + '”. Try a shorter word.</p>'; return; }

      var html = "", letter = "";
      matches.forEach(function (x) {
        var first = x.t[0].toUpperCase();
        if (first !== letter) { letter = first; html += '<div class="gloss-letter">' + letter + '</div>'; }
        var link = x.s ? ' <a class="gloss-link" href="' + x.s + '/">' + (x.l || "See lesson") + ' →</a>' : "";
        html += '<div class="gloss-item" id="' + slugify(x.t) + '"><h3>' + x.t + '</h3><p>' + x.d + link + '</p></div>';
      });
      host.innerHTML = '<div class="gloss-list">' + html + '</div>';
    }

    filter.addEventListener("input", function () { render(filter.value); });
    render("");
    // support deep links like glossary.html#p-value
    if (location.hash) {
      var el = document.getElementById(location.hash.slice(1));
      if (el) el.scrollIntoView();
    }
  })();
  </script>
